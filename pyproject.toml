[project]
name = "ai-agent-convo"
version = "0.1.0"
description = "WhatsApp clinic assistant: Q&A, appointment booking, human handoff, multilingual (Gemini + MongoDB + Redis)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "google-genai>=0.8",
    "pymongo>=4.10",
    "redis>=5.2",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "mongomock>=4.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false
